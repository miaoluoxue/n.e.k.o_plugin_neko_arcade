[plugin]
id = "neko_arcade"
type = "plugin"
name = "猫娘小游戏"
description = "让猫娘陪你玩各种小游戏——钓鱼、海龟汤、猜硬币、修仙……一个插件，无限可能。"
short_description = "Neko mini-games hub for N.E.K.O."
keywords = ["game", "游戏", "小游戏", "mini-games", "fun", "fishing", "钓鱼", "猜硬币", "coinflip", "海龟汤", "猜谜", "soupbubble", "turtle-soup", "修仙", "xiuxian", "cultivation", "诸天", "play", "玩"]
version = "0.3.0"
entry = "plugins.neko_arcade:NekoArcadePlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = false

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "猫娘小游戏"
entry = "static/index.html"
context = "dashboard"
permissions = ["state:read", "action:call"]

[[plugin.ui.guide]]
id = "guide"
title = "使用指南"
entry = "docs/guide.md"
mode = "markdown"
permissions = ["state:read"]

[[plugin.ui.guide]]
id = "development"
title = "开发文档"
entry = "docs/development.md"
mode = "markdown"
permissions = ["state:read"]

[[plugin.ui.guide]]
id = "rules"
title = "接入规则"
entry = "docs/rules.md"
mode = "markdown"
permissions = ["state:read"]

[[plugin.ui.guide]]
id = "architecture"
title = "运行机制总纲"
entry = "docs/ARCHITECTURE.md"
mode = "markdown"
permissions = ["state:read"]