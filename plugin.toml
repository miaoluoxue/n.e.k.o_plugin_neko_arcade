[plugin]
id = "neko_arcade"
type = "plugin"
name = "猫娘小游戏"
description = "让猫娘陪你玩各种小游戏——钓鱼、海龟汤、猜硬币、修仙……一个插件，无限可能。"
short_description = "Neko mini-games hub for N.E.K.O."
keywords = ["game", "游戏", "小游戏", "mini-games", "fun", "play", "玩", "钓鱼", "鱼缸", "抛竿", "猜硬币", "硬币", "海龟汤", "汤底", "修仙", "诸天", "修真", "修炼", "突破", "境界", "猫猫进化路", "进化", "领养小猫", "历史上的今天", "今日历史", "俄罗斯轮盘", "轮盘", "装弹", "开枪", "人生重开", "重启人生", "重开", "随机人生", "塔罗", "塔罗牌", "占卜", "抽牌", "牌阵", "发图", "相册", "图库", "喵图", "照片"]
version = "0.5.0"
entry = "plugins.neko_arcade:NekoArcadePlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = false

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "猫娘小游戏"
entry = "static/index.html"
context = "dashboard"
permissions = ["state:read", "action:call"]

[[plugin.ui.guide]]
id = "guide"
title = "使用指南"
entry = "docs/guide.md"
mode = "markdown"
permissions = ["state:read"]

[[plugin.ui.guide]]
id = "development"
title = "开发文档"
entry = "docs/development.md"
mode = "markdown"
permissions = ["state:read"]

[[plugin.ui.guide]]
id = "rules"
title = "接入规则"
entry = "docs/rules.md"
mode = "markdown"
permissions = ["state:read"]

[[plugin.ui.guide]]
id = "architecture"
title = "运行机制总纲"
entry = "docs/ARCHITECTURE.md"
mode = "markdown"
permissions = ["state:read"]
