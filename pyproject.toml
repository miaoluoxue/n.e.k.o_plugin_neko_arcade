[project]
name = "neko_arcade"
version = "0.5.6"
description = "N.E.K.O mini-games hub: catgirl plays fishing, turtle-soup, coin-flip and more."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[tool.neko.build]
exclude_dirs = [
    ".vscode",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "tests",
    ".tmp_neko_photo_test",
    ".tmp_push_sender_test",
    # 喵图相册图库: 用户上传/自建的图**绝不进包**(打包发布默认空图库)
    "games/neko_photo/data",
]
exclude_files = [
    ".gitignore",
    "README.md",
    "uv.lock",
    "ruff.toml",
    "LICENSE",
    "data/store.db",
    "*.neko-plugin",
    "*.neko-bundle",
    # 完整文档(在 GitHub 仓库 docs/)——不打包进发布包;
    # 面板仅展示 docs/ui/ 下的简版文档(plugin.toml ui.guide 指向)
    "docs/CHANGELOG.md",
    "docs/development.md",
    "docs/rules.md",
    "docs/pitfalls.md",
    "docs/ARCHITECTURE.md",
]
